version: '3.8'

services:
  # MongoDB — pakai MongoDB Atlas (MONGODB_URI di .env).
  # Untuk pakai lokal: uncomment blok ini dan set MONGODB_URI=mongodb://mongodb:27017/hmif-platform
  # mongodb:
  #   image: mongo:4.4
  #   container_name: hmif-mongodb
  #   restart: always
  #   environment:
  #     MONGO_INITDB_DATABASE: hmif-platform
  #   command: ["mongod", "--wiredTigerCacheSizeGB", "0.5", "--quiet"]
  #   volumes:
  #     - mongodb_data:/data/db
  #   ports:
  #     - "127.0.0.1:27017:27017"
  #   networks:
  #     - hmif-network

  # Backend Express API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ghcr.io/danieljoanf/hmif-backend:latest
    container_name: hmif-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - CHATBOT_SERVICE_URL=http://chatbot:8000
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - hmif-network

  # Chatbot FastAPI Service
  chatbot:
    build:
      context: ./chatbot-api
      dockerfile: Dockerfile
    image: ghcr.io/danieljoanf/hmif-chatbot:latest
    container_name: hmif-chatbot
    restart: always
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - hmif-network

  # Frontend Static Site (build multi-stage: Vite -> Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ghcr.io/danieljoanf/hmif-frontend:latest
    container_name: hmif-frontend
    restart: always
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      - backend
    networks:
      - hmif-network
      - npm-net

networks:
  hmif-network:
    driver: bridge
  npm-net:
    external: true
    name: nginx-proxy-manager_default
