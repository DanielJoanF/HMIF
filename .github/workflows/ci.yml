name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (non-blocking)
        run: npm run lint || true
      - name: Build Frontend
        env:
          VITE_API_URL: https://hmif-usd.org/api
          VITE_CHATBOT_API_URL: https://hmif-usd.org/chatbot
        run: npm run build

  backend-check:
    name: Backend (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --only=production
        working-directory: server
      - run: node --check server.js
        working-directory: server

  chatbot-check:
    name: Chatbot (import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
        working-directory: chatbot-api
      - run: python -c "import main"
        working-directory: chatbot-api
