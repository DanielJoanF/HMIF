name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"

jobs:
  build-and-push:
    name: Build & push images ke GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/danieljoanf/hmif-frontend:latest
            ghcr.io/danieljoanf/hmif-frontend:${{ github.sha }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/danieljoanf/hmif-backend:latest
            ghcr.io/danieljoanf/hmif-backend:${{ github.sha }}

      - name: Build & push chatbot
        uses: docker/build-push-action@v6
        with:
          context: ./chatbot-api
          file: chatbot-api/Dockerfile
          push: true
          tags: |
            ghcr.io/danieljoanf/hmif-chatbot:latest
            ghcr.io/danieljoanf/hmif-chatbot:${{ github.sha }}
