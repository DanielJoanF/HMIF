events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # HTTP only — TLS diterminasi di NPM / Cloudflare edge
    server {
        listen 80;
        server_name hmif-usd.org www.hmif-usd.org;

        # Serve static files (React build)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Cache hashed Vite assets for 1 year
        location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2|woff|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Proxy API requests to backend
        location /api/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Serve uploaded files
        location /uploads/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream$request_uri;
        }

        # Proxy chatbot requests
        location /chatbot/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $chatbot_upstream http://chatbot:8000;
            rewrite ^/chatbot/(.*)$ /$1 break;
            proxy_pass $chatbot_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
